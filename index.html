<script>
/* ================================================================== *
 *  CONFIGURAÇÃO — cole aqui o link do seu Apps Script                *
 *  Deve terminar em /exec                                            *
 * ================================================================== */
/* Endereço da sua API do ogol (uvicorn). Só funciona na máquina em
   que ela está rodando. */
var URL_OGOL = "http://localhost:8000";

var URL_PLANILHA = "https://script.google.com/macros/s/AKfycbyUfCWx2wyKuaGa3JcA5xqsGx4GzWDMZTMRxKBdonE_qkrTrsM6nVgZ4_xh64IjHHM/exec";



/* ------------------------------------------------------------------ *
 *  Armazenamento na planilha, com cópia local de segurança.
 *  A cópia local serve para: (a) abrir rápido, (b) não perder nada
 *  se a internet cair no meio de uma gravação.
 * ------------------------------------------------------------------ */
var CHAVE_LOCAL = "pg:painel-ld";

function bandeira(texto, tipo) {
  var d = document.getElementById("bandeira");
  if (!d) {
    d = document.createElement("div");
    d.id = "bandeira";
    document.body.insertBefore(d, document.body.firstChild);
  }
  d.className = "aviso-topo " + tipo;
  d.textContent = texto;
  if (tipo === "ok") setTimeout(function () { if (d) d.remove(); }, 2500);
}

window.PG_URL = null;

var configurado =
  URL_PLANILHA.indexOf("/exec") !== -1 &&
  URL_PLANILHA.indexOf("COLE_AQUI") === -1;

if (configurado) window.PG_URL = URL_PLANILHA;
window.PG_OGOL = URL_OGOL.replace(/\/+$/, "");

/* O Apps Script hiberna quando fica sem uso e a primeira chamada pode
   levar mais de meio minuto para acordar. Damos prazo largo e uma
   segunda tentativa antes de desistir — sem isso o painel ficaria
   preso em "Abrindo o quadro…" ou acusaria falha à toa. */
async function buscarComPrazo(url, opcoes, segundos) {
  var prazo = (segundos || 35) * 1000;

  async function tentar(ms) {
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, ms);
    try {
      return await fetch(url, Object.assign({}, opcoes || {}, { signal: ctrl.signal }));
    } finally {
      clearTimeout(t);
    }
  }

  try {
    return await tentar(prazo);
  } catch (e) {
    if (e && e.name === "AbortError") {
      bandeira("A planilha está acordando — tentando de novo…", "ok");
      return await tentar(prazo);   // segunda e última tentativa
    }
    throw e;
  }
}

window.storage = {
  async get(chave) {
    var local = localStorage.getItem(CHAVE_LOCAL);

    if (!configurado) {
      bandeira("Planilha não configurada: a linha URL_PLANILHA ainda está com o texto de exemplo. Edite o arquivo e publique de novo.", "erro");
      if (local === null) throw new Error("sem registro");
      return { key: chave, value: local };
    }

    try {
      var r = await buscarComPrazo(URL_PLANILHA, { method: "GET" }, 35);
      var j = await r.json();
      if (!j.ok) throw new Error(j.erro || "resposta inválida");

      var texto = JSON.stringify(j.dados);
      localStorage.setItem(CHAVE_LOCAL, texto);
      return { key: chave, value: texto };
    } catch (e) {
      bandeira(
        (e && e.name === "AbortError"
          ? "A planilha não respondeu em dois minutos. "
          : "Sem conexão com a planilha. ") +
        "Mostrando a última cópia deste computador — NÃO edite até reconectar.",
        "erro"
      );
      if (local === null) throw new Error("sem registro");
      return { key: chave, value: local };
    }
  },

  async set(chave, valor) {
    // Grava local primeiro: nunca se perde o que acabou de ser digitado.
    localStorage.setItem(CHAVE_LOCAL, valor);

    if (!configurado) return { key: chave, value: valor };

    try {
      var r = await buscarComPrazo(URL_PLANILHA, {
        method: "POST",
        // text/plain evita a checagem prévia que o Apps Script não responde
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ dados: JSON.parse(valor) })
      }, 35);
      var j = await r.json();
      if (!j.ok) throw new Error(j.erro || "falha ao gravar");
      bandeira("Salvo na planilha", "ok");
      return { key: chave, value: valor };
    } catch (e) {
      bandeira("Não consegui salvar na planilha. A alteração está neste computador — recarregue quando a conexão voltar.", "erro");
      return { key: chave, value: valor };
    }
  }
};

if (!window.React) {
  document.getElementById("raiz").innerHTML =
    '<div class="falha"><b>Não consegui carregar as bibliotecas.</b><br>' +
    'Este arquivo precisa de internet. Conecte-se e recarregue a página.</div>';
}
</script>

/* ==================================================================

   O campo `evitar` descarta notícias que contenham aquelas expressões,

const CLUBES_POR_COMPETICAO = {

/* ==================================================================
   EDIÇÕES NO OGOL — para o botão que puxa o elenco pela sua API.

   A chave é o nome exato da competição no seletor do painel; o valor
   é o ID da edição no ogol. Para descobrir o ID, abra a competição no

   ================================================================== */
const EDICOES_OGOL = {

  "Série C": "210279",

  "Paulista A3": "210256",
  "Carioca Série A": "203735",

  "Mineiro Módulo II": "210174",
  "Capixaba Série A": "210101",
};

/* A API aceita esta lista fechada de posições; o painel usa códigos
   curtos. "Ponta" existe lá e não aqui, então cai em atacante. */
const POSICAO_NA_API = {

  pe: "ponta esquerda",

};

/* Janelas de tempo aceitas pelo Google Notícias. */
const PERIODOS = [
  { v: "1d", label: "últimas 24 horas" },
  { v: "7d", label: "últimos 7 dias" },
  { v: "15d", label: "últimos 15 dias" },

/* Posições que o radar sabe procurar. O primeiro termo de cada lista
   é o que vai para a busca; os demais afinam o filtro dos títulos. */
/* `busca` é o que se pergunta ao Google — precisa ser amplo, porque a
   imprensa costuma escrever só "lateral". `termos` é o filtro fino,
   aplicado depois sobre o título. */
const POSICOES = [
  { id: "gol", label: "Goleiro", busca: ["goleiro"],
    termos: ["goleiro", "arqueiro", "guarda-redes"] },
  { id: "zag", label: "Zagueiro", busca: ["zagueiro"],
    termos: ["zagueiro", "zaga", "defensor", "defesa central"] },
  { id: "ld", label: "Lateral Direito", busca: ["lateral"],
    termos: ["lateral-direito", "lateral direito", "lateral da direita", "ala-direito", "lateral"],
    excluir: ["lateral-esquerdo", "lateral esquerdo", "lateral da esquerda", "ala-esquerdo"] },
  { id: "le", label: "Lateral Esquerdo", busca: ["lateral"],
    termos: ["lateral-esquerdo", "lateral esquerdo", "lateral da esquerda", "ala-esquerdo", "lateral"],
    excluir: ["lateral-direito", "lateral direito", "lateral da direita", "ala-direito"] },
  { id: "vol", label: "Volante", busca: ["volante"],
    termos: ["volante", "primeiro volante", "cabeca de area", "trinco"] },
  { id: "mc", label: "Meia Central", busca: ["meia"],
    termos: ["meia central", "meio-campo central", "medio centro"] },
  { id: "mei", label: "Meia", busca: ["meia"],
    termos: ["meia", "meio-campista", "camisa 10"] },
  { id: "me", label: "Meia Esquerda", busca: ["meia"],
    termos: ["meia esquerda", "meia-esquerda", "medio esquerdo"],
    excluir: ["meia direita", "meia-direita"] },
  { id: "md", label: "Meia Direita", busca: ["meia"],
    termos: ["meia direita", "meia-direita", "medio direito"],
    excluir: ["meia esquerda", "meia-esquerda"] },
  { id: "mo", label: "Meia Ofensivo", busca: ["meia"],
    termos: ["meia ofensivo", "meia-atacante", "camisa 10", "armador"] },

  { id: "pe", label: "Ponta Esquerda", busca: ["ponta"],

  { id: "ata", label: "Atacante (geral)", busca: ["atacante"],

];

/* Categorias em que a agência atua. A categoria muda a leitura do
   mercado: na base o elenco é remontado por temporada, então janela
   aberta pesa mais que evento. */
const CATEGORIAS = [
  { id: "pro", label: "Profissional" },
  { id: "sub23", label: "Sub-23" },
  { id: "sub20", label: "Sub-20" },
  { id: "sub17", label: "Sub-17" },

];

const SITUACOES = [
  { v: "livre", label: "sem clube" },
  { v: "em_contrato", label: "em contrato" },
  { v: "emprestado", label: "emprestado" },
  { v: "encerrando", label: "contrato encerrando" },
];

const novoAtleta = () => ({

  nome: "",
  posicao: "ld",
  categoria: "pro",

/* A ficha é clube + posição + categoria. O mesmo clube pode estar no
   radar por lateral-direito profissional e por goleiro sub-20, com
   elencos, notas e pontuações separados. Fichas antigas, sem categoria,
   contam como profissional. */
const chaveFicha = (nome, pos, cat) =>
  normNome(nome) + "|" + (pos || "ld") + "|" + (cat || "pro");

const rotuloCat = (id) =>
  (CATEGORIAS.find((c) => c.id === id) || {}).label || "";

const rotuloPos = (id) =>
  (POSICOES.find((p) => p.id === id) || {}).label || "posição";

/* Normalizações de nome. Ficam fora do componente porque são usadas
   já na primeira montagem do ranking. */
const nomeSimples = (t) =>
  (t || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

const normNome = (t) =>
  nomeSimples(t)
    .replace(/\b(futebol|clube|associacao|atletico|esporte|esportes|saf|ec|fc|ac|ge|se)\b/g, "")
    .replace(/[^a-z0-9]/g, "");


/* Garante que as quatro divisões nacionais estejam sempre no radar,
   preservando a data que o usuário já tenha preenchido — inclusive de
   versões antigas do painel, onde a Série D vinha com outro nome. */
function comNacionais(lista) {
  const atual = Array.isArray(lista) ? lista : [];
  const fixas = NACIONAIS.map((n) => {
    const antiga = atual.find(
      (c) =>
        c.id === n.id ||
        (c.nome || "").toLowerCase().startsWith(n.nome.toLowerCase())
    );
    return { ...n, janela: (antiga && antiga.janela) || "" };
  });
  const resto = atual.filter(
    (c) =>
      !NACIONAIS.some(
        (n) =>
          c.id === n.id ||
          (c.nome || "").toLowerCase().startsWith(n.nome.toLowerCase())
      )
  );
  return [...fixas, ...resto];
}

const STATUS_TITULAR = [
  { v: "desconhecido", label: "não sei ainda", pts: 0 },
  { v: "ok", label: "titular firme", pts: 0 },
  { v: "improvisado", label: "improvisado na posição", pts: 25 },
  { v: "suspenso", label: "suspenso / pendurado", pts: 18 },
  { v: "lesionado", label: "lesionado", pts: 32 },
  { v: "saiu", label: "rescindiu / foi vendido", pts: 36 },
];

const RESPOSTAS = [
  { v: "nao_contatado", label: "não contatado" },
  { v: "aguardando", label: "aguardando retorno" },
  { v: "fechado", label: '"elenco fechado"' },
  { v: "interesse", label: "demonstrou interesse" },
  { v: "negociando", label: "negociando" },
];

/* -------- leitura do elenco de laterais-direitos ------------------ */
/* Recebe [{nome, min}] e devolve o retrato da posição no clube.      */
function elenco(c) {
  // Quando o atleta traz a quebra por competição e a ficha tem uma
  // competição definida, valem os números DAQUELA competição. Um lateral
  // com 1.700 minutos no Paulista A4 e 270 na Copa Paulista é titular
  // absoluto num lugar e coadjuvante no outro.
  const daComp = (x) => {
    const mapa = x.porComp || null;
    if (mapa && c.competicao && mapa[c.competicao]) return mapa[c.competicao];
    return { min: x.min, jogos: x.jogos };
  };

  const lds = (c.laterais || [])
    .map((x) => {
      const n = daComp(x);
      return {
        nome: (x.nome || "").trim(),
        min: Number(n.min) || 0,
        jogos: Number(n.jogos) || 0,
      };
    })
    .filter((x) => x.nome)
    .map((x) => ({ ...x, media: x.jogos ? Math.round(x.min / x.jogos) : null }))
    .sort((a, b) => b.min - a.min);

  // Zero confirmado é diferente de "não mapeei ainda": a posição está
  // literalmente vaga, e esse é o clube mais frágil que existe.
  if (!lds.length) {
    if (String(c.lds).trim() === "0") {
      return { lds: [], total: 0, conc: 0, rodaram: 0, vazio: true,
               perfil: "nenhum atleta na posição", uso: "", fragilidade: 80 };
    }
    return null;
  }

  const total = lds.reduce((a, b) => a + b.min, 0) || 1;
  const rodaram = lds.filter((x) => x.min >= 300).length;
  const conc = lds[0].min / total;
  const m = lds[0].media;

  let perfil, fragilidade;
  if (lds.length === 1) {
    // Um atleta só: o clube está a UMA lesão ou suspensão de não ter
    // ninguém. Não é a mesma coisa que já estar vazio (80), mas é
    // qualitativamente diferente de ter reserva, mesmo reserva parado.
    perfil = "só um no elenco";
    fragilidade = 60;
  } else if (conc >= 0.85) {
    perfil = "titular absoluto, reserva quase não joga";
    fragilidade = 22;
  } else if (conc >= 0.65) {
    perfil = "titular claro com reserva de apoio";
    fragilidade = 10;
  } else {
    perfil = "revezamento — dois rodando";
    fragilidade = 0;
  }

  // A média por jogo separa quem joga os 90 de quem entra e sai.
  let uso = "";
  if (m !== null) {
    if (m >= 80) {
      uso = `joga os 90 (${m} min/jogo)`;
      fragilidade += 8;   // sai ele, não há quem faça o mesmo
    } else if (m >= 55) {
      uso = `titular que costuma ser substituído (${m} min/jogo)`;
    } else if (m >= 25) {
      uso = `entra e sai (${m} min/jogo)`;
      fragilidade -= 6;   // o clube já divide a posição
    } else {
      uso = `pouco usado (${m} min/jogo)`;
      fragilidade -= 6;
    }
  }

  if (rodaram >= 3) fragilidade -= 8;

  return { lds, total, conc, rodaram, perfil, uso, fragilidade };
}

/* Casa o nome do BID com um lateral do elenco.                       */
/* O BID traz nome de registro; o ogol, o nome popular. Comparamos    */
/* por partes do nome — duas coincidências bastam.                    */
function casaNome(a, b) {
  const partes = (t) =>
    (t || "")
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .split(/[^a-z]+/)
      .filter((x) => x.length > 2 && !["dos","das","de","da","do","junior","filho","neto"].includes(x));
  const A = partes(a), B = partes(b);
  if (!A.length || !B.length) return false;
  const iguais = A.filter((x) => B.includes(x)).length;
  return iguais >= 2 || (B.length === 1 && A.includes(B[0]));
}

/* O nome do atleta aparece dentro do título da notícia?               */
/* Diferente do BID: aqui procuramos o nome dentro de uma frase.       */
function nomeNoTexto(nome, texto) {
  const limpa = (t) =>
    (t || "")
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase();
  const alvo = limpa(texto);
  const partes = limpa(nome)
    .split(/[^a-z]+/)
    .filter((x) => x.length > 2 && !["dos","das","de","da","do","junior","filho","neto"].includes(x));
  if (!partes.length) return false;
  // Nome de uma palavra só ("Ariel") precisa bater como palavra inteira.
  return partes.every((x) => new RegExp(`\\b${x}\\b`).test(alvo));
}

function score(c) {
  let s = 0;
  const d = dias(c.janelaAte);
  const e = elenco(c);

  // Janela regulamentar
  if (d !== null) {
    if (d < 0) s -= 40;
    else if (d <= 7) s += 34;
    else if (d <= 21) s += 26;
    else if (d <= 45) s += 16;
    else s += 8;
  }

  // Estrutura da posição no elenco
  if (e) {
    s += e.fragilidade;
  } else {
    s -= 6; // elenco não mapeado — investigue antes de ligar
  }

  // Sinais importados, com decaimento no tempo
  for (const sig of c.sinais || []) {
    const idadeSinal = sig.quando ? -dias(sig.quando) : 99;
    const decai = idadeSinal <= 2 ? 1 : idadeSinal <= 7 ? 0.6 : idadeSinal <= 21 ? 0.3 : 0.1;
    let peso = Number(sig.peso) || 0;

    // Rescisão do BID: só vale se o nome bater com um lateral do elenco
    if (sig.fonte === "BID" && peso > 0 && sig.atleta) {
      if (!e) {
        peso = peso * 0.5;            // sem elenco mapeado, sinal só indicativo
      } else {
        const i = e.lds.findIndex((x) => casaNome(sig.atleta, x.nome));
        if (i === 0) peso = 55;       // saiu o titular — vaga crítica
        else if (i > 0) peso = 22;    // saiu o reserva
        else peso = -8;               // não era lateral: ruído, tira do topo
      }
    }

    // Notícia: se o título cita um lateral que você cadastrou, o peso
    // passa a depender de QUEM é — titular ou reserva.
    if (sig.fonte !== "BID" && e && sig.texto && peso > 0) {
      const i = e.lds.findIndex((x) => nomeNoTexto(x.nome, sig.texto));
      if (i === 0) {
        peso = Math.max(peso, 50);
        sig.quem = e.lds[0].nome + " (titular)";
      } else if (i > 0) {
        peso = Math.min(peso, 12);
        sig.quem = e.lds[i].nome + " (reserva)";
      }
    }
    s += peso * decai;
  }

  // Evento no titular, quando você anotou à mão
  const temBid = (c.sinais || []).some((x) => x.fonte === "BID");
  if (!temBid || c.statusTitular === "improvisado")
    s += (STATUS_TITULAR.find((x) => x.v === c.statusTitular) || {}).pts || 0;

  // Histórico de contato
  const desde = c.ultimoContato ? -dias(c.ultimoContato) : null;
  if (c.resposta === "interesse") s += 20;
  if (c.resposta === "negociando") s += 26;
  if (c.resposta === "fechado") s += desde !== null && desde >= 21 ? 6 : -14;

  return Math.max(0, Math.round(s));
}

function faixa(s) {
  if (s >= 70) return { label: "ligar hoje", cor: C.alerta };
  if (s >= 45) return { label: "esta semana", cor: C.amber };
  if (s >= 20) return { label: "monitorar", cor: C.calma };
  return { label: "frio", cor: "#8A8A80" };
}

function Painel() {
  const [clubes, setClubes] = useState([]);
  const [atletas, setAtletas] = useState([]);
  const [comps, setComps] = useState(comNacionais([]));

  const [pagina, setPagina] = useState(0);
  const [filtroPos, setFiltroPos] = useState("");
  const [filtroCat, setFiltroCat] = useState("");
  const [filtroComp, setFiltroComp] = useState("");
  const [consulta, setConsulta] = useState(null);
  const [verAtletas, setVerAtletas] = useState(false);
  const [atletaFoco, setAtletaFoco] = useState("");
  const [bidTexto, setBidTexto] = useState("");
  const [colarBid, setColarBid] = useState(false);
  const [buscando, setBuscando] = useState(false);
  const [puxando, setPuxando] = useState(false);
  const [progressoOgol, setProgressoOgol] = useState("");
  const [popBusca, setPopBusca] = useState(false);
  const [posBusca, setPosBusca] = useState("ld");
  const [catBusca, setCatBusca] = useState("pro");
  const [ufBusca, setUfBusca] = useState("");
  const [compBusca, setCompBusca] = useState("");
  const [periodoBusca, setPeriodoBusca] = useState("7d");
  const [backupTexto, setBackupTexto] = useState("");
  const [colarBackup, setColarBackup] = useState(false);
  const [textoColado, setTextoColado] = useState("");
  const [ufSel, setUfSel] = useState("");
  const [compSel, setCompSel] = useState("");
  const [outra, setOutra] = useState(false);
  const [outraNome, setOutraNome] = useState("");

  useEffect(() => {
    let vivo = true;

    // Rede de segurança: aconteça o que acontecer, a tela sai do
    // "Abrindo o quadro…" em 30 segundos.
    const destravar = setTimeout(() => {
      if (vivo) {
        setCarregando(false);
        setErro("A planilha não respondeu. Recarregue a página — o Apps Script costuma acordar na segunda tentativa.");
      }
    }, 100000);

    (async () => {
      try {
        const r = await window.storage.get("painel-ld");
        if (r && vivo) {
          const d = JSON.parse(r.value);
          setClubes(d.clubes || []);
          setAtletas(d.atletas || []);
          setComps(comNacionais(d.comps));
        }
      } catch (e) {
        /* primeira vez, ou planilha fora do ar */
      }
      if (vivo) {
        clearTimeout(destravar);
        setCarregando(false);
      }
    })();

    return () => { vivo = false; clearTimeout(destravar); };
  }, []);

  const salvar = async (next) => {
    try {
      await window.storage.set("painel-ld", JSON.stringify(next));
      setErro("");
    } catch (e) {
      setErro("Não deu para salvar agora. Suas edições continuam na tela, mas exporte o CSV antes de fechar.");
    }
  };

  const commit = (patch) => {
    const next = { clubes, comps, atletas, ...patch };
    if (patch.clubes) setClubes(patch.clubes);
    if (patch.atletas) setAtletas(patch.atletas);
    if (patch.comps) { patch.comps = comNacionais(patch.comps); setComps(patch.comps); }
    salvar(next);
  };

  const editar = (id, campo, valor) =>
    commit({ clubes: clubes.map((c) => (c.id === id ? { ...c, [campo]: valor } : c)) });

  const ordenados = useMemo(() => {
    const f = filtro.trim().toLowerCase();

    if (!consulta) return [];
    const { pos: qPos, comp: qComp, cat: qCat } = consulta;

    const reais = clubes
      .map((c) => ({ ...c, _s: score(c) }))
      .filter((c) => !qPos || (c.posicao || "ld") === qPos)
      .filter((c) => !qCat || (c.categoria || "pro") === qCat)
      .filter((c) => !qComp || c.competicao === qComp);

    // Com uma competição filtrada, os participantes que ainda não têm ficha
    // entram como fantasmas em zero — assim você vê a competição inteira.
    let fantasmas = [];
    if (qComp && CLUBES_POR_COMPETICAO[qComp]) {
      const jaTem = new Set(reais.map((c) => normNome(c.clube)));
      fantasmas = CLUBES_POR_COMPETICAO[qComp]
        .map((x) => (typeof x === "string" ? x : x.nome))
        .filter((nome) => !jaTem.has(normNome(nome)))
        .map((nome) => ({
          id: "fantasma-" + normNome(nome),
          clube: nome,
          uf: "",
          competicao: qComp,
          posicao: qPos || "ld",
          categoria: qCat || "pro",
          sinais: [],
          laterais: [],
          notas: "",
          _s: 0,
          _fantasma: true,
        }));
    }

    return [...reais, ...fantasmas]
      .filter((c) =>
        !f ||
        [c.clube, c.uf, c.competicao, c.titular, c.notas].join(" ").toLowerCase().includes(f)
      )
      .sort((a, b) => b._s - a._s || a.clube.localeCompare(b.clube));
  }, [clubes, filtro, consulta]);

  /* Competições do filtro do ranking: as que já têm ficha MAIS as que
     têm ID no ogol. Sem estas últimas o botão de extração ficaria
     inalcançável — você precisaria da ficha para criar a ficha. */
  const compsNoRanking = useMemo(() => {
    const nasFichas = new Set(clubes.map((c) => c.competicao).filter(Boolean));
    const comId = Object.keys(EDICOES_OGOL);
    return [...new Set([...nasFichas, ...comId])].sort((a, b) =>
      a.localeCompare(b, "pt-BR")
    );
  }, [clubes]);

  /* Marca no seletor quais competições dá para extrair direto. */
  const temExtracao = (nome) => !!EDICOES_OGOL[nome];

  /* Posições presentes nas fichas, com a contagem de cada uma. */
  const posNoRanking = useMemo(() => {
    const m = new Map();
    for (const c of clubes) {
      const k = c.posicao || "ld";
      m.set(k, (m.get(k) || 0) + 1);
    }
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  }, [clubes]);

  const importar = () => {
    const linhas = bulk.split("\n").map((l) => l.trim()).filter(Boolean);
    const novos = linhas.map((l) => {
      const [clube, uf, competicao] = l.split(/[;,]/).map((x) => (x || "").trim());
      return { ...novoClube(), clube, uf: uf || "", competicao: competicao || "" };
    });
    commit({ clubes: [...clubes, ...novos] });
    setBulk("");
    setColando(false);
  };

  /* ---- importação dos CSVs gerados pelos scripts ---------------- */

  const lerCSV = (txt) => {
    const linhas = txt.replace(/^\uFEFF/, "").trim().split(/\r?\n/);
    if (linhas.length < 2) return [];
    const sep = linhas[0].includes(";") ? ";" : ",";
    const cab = linhas[0].split(sep).map((h) => h.trim());
    return linhas.slice(1).map((l) => {
      const v = l.split(sep);
      return Object.fromEntries(cab.map((h, i) => [h, (v[i] || "").trim()]));
    });
  };

  const dataBR = (t) => {
    if (!t) return "";
    const m = t.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (m) return `${m[3]}-${m[2]}-${m[1]}`;
    const iso = t.match(/(\d{4})-(\d{2})-(\d{2})/);
    return iso ? iso[0] : "";
  };

  const importarCSV = async (arquivo) => {
    const texto = await arquivo.text();
    const linhas = lerCSV(texto);
    if (!linhas.length) {
      setErro("Não consegui ler esse arquivo. Use os CSVs gerados pelos scripts.");
      return;
    }

    const cols = Object.keys(linhas[0]);
    const tem = (...n) => n.some((x) => cols.includes(x));
    // Planilha de elenco: uma linha por atleta, com posição e minutagem.
    if (tem("_clube") && tem("_posicao")) {
      importarElenco(linhas);
      return;
    }

    const eBid = tem("situacao", "tipo_bid", "atleta", "leitura");
    const eNoticia = tem("sinais", "titulo", "pontos");
    if (!eBid && !eNoticia) {
      setErro(
        "Não reconheci as colunas deste CSV: " +
          cols.join(", ") +
          ". Se for um arquivo antigo, apague-o no Colab e rode o filtro de novo."
      );
      return;
    }

    const mapa = new Map(clubes.map((c) => [normNome(c.clube), { ...c }]));
    let novosClubes = 0, novosSinais = 0;

    for (const l of linhas) {
      const nome = (l.clube || "").trim();
      if (!nome) continue;
      const k = normNome(nome);

      let c = mapa.get(k);
      if (!c) {
        c = { ...novoClube(), clube: nome, uf: l.uf || "" };
        mapa.set(k, c);
        novosClubes++;
      }
      c.sinais = c.sinais || [];

      let sig;
      if (eBid) {
        const sit =
          l.situacao ||
          { RESCISAO: "VAGA ABERTA", SAIDA: "SAIDA", ENTRADA: "ENTRADA" }[l.tipo] ||
          "OUTRO";
        const peso = { "VAGA ABERTA": 30, SAIDA: 16, ENTRADA: -12 }[sit] ?? 0;
        sig = {
          fonte: "BID",
          quando: dataBR(l.publicacao) || dataBR(l.data_consulta),
          peso,
          atleta: (l.atleta || "").trim(),
          texto: `${sit} — ${l.atleta || l.linha || ""}${l.idade ? `, ${l.idade} anos` : ""}`,
          link: "",
        };
        if (sit === "VAGA ABERTA" && c.statusTitular === "desconhecido")
          c.statusTitular = "saiu";
      } else {
        const sinais = l.sinais || "";
        sig = {
          fonte: l.fonte || "notícia",
          quando: dataBR(l.data) || HOJE(),
          peso: Math.min(Number(l.pontos) || 0, 6) * 4,
          texto: l.titulo || "",
          link: l.link || "",
        };
        if (c.statusTitular === "desconhecido") {
          if (/lesao/.test(sinais)) c.statusTitular = "lesionado";
          else if (/rescisao/.test(sinais)) c.statusTitular = "saiu";
          else if (/suspensao/.test(sinais)) c.statusTitular = "suspenso";
        }
      }

      const jaTem = c.sinais.some(
        (x) => x.texto === sig.texto && x.fonte === sig.fonte
      );
      if (!jaTem && sig.texto) {
        c.sinais.push(sig);
        novosSinais++;
      }
    }

    commit({ clubes: [...mapa.values()] });
    setErro("");
    setAviso(
      `${novosSinais} ${novosSinais === 1 ? "sinal novo" : "sinais novos"}` +
        (novosClubes ? ` · ${novosClubes} clube(s) criado(s)` : "")
    );
  };

  const baixarBackup = () => {
    const dados = JSON.stringify({ versao: 1, quando: HOJE(), clubes, comps });
    setBackupTexto(dados);
    setColarBackup(false);
    // Alguns ambientes bloqueiam download de arquivo; se falhar, o texto
    // abaixo continua servindo para copiar.
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([dados], { type: "application/json" }));
      a.download = `backup-painel-${HOJE()}.json`;
      a.click();
    } catch (e) { /* sem download: use o texto */ }
  };

  const restaurarBackup = async (origem) => {
    try {
      const bruto = typeof origem === "string" ? origem : await origem.text();
      const d = JSON.parse(bruto);
      if (!Array.isArray(d.clubes)) throw new Error("formato");
      const vindos = d.clubes.map((c) => ({ ...novoClube(), ...c }));

      // Funde com o que já existe: mesmo clube não vira ficha duplicada.
      const mapa = new Map(clubes.map((c) => [normNome(c.clube), { ...c }]));
      let novos = 0, fundidos = 0;
      for (const v of vindos) {
        const k = normNome(v.clube);
        const atual = mapa.get(k);
        if (!atual) { mapa.set(k, v); novos++; continue; }
        fundidos++;
        atual.laterais = (atual.laterais || []).length ? atual.laterais : v.laterais || [];
        const chaves = new Set((atual.sinais || []).map((x) => x.fonte + "|" + x.texto));
        for (const sg of v.sinais || [])
          if (!chaves.has(sg.fonte + "|" + sg.texto)) (atual.sinais = atual.sinais || []).push(sg);
        for (const campo of ["competicao", "janelaAte", "titular", "ultimoContato", "proximo", "notas", "uf"])
          if (!atual[campo] && v[campo]) atual[campo] = v[campo];
      }

      commit({ clubes: [...mapa.values()], comps: comNacionais(d.comps || comps) });
      setErro("");
      setAviso(`Backup restaurado — ${novos} ficha(s) nova(s), ${fundidos} atualizada(s)`);
      setColarBackup(false);
      setBackupTexto("");
      setTextoColado("");
    } catch (e) {
      setErro("Não consegui ler esse backup. Cole o texto inteiro gerado pelo botão Backup, do { ao }.");
    }
  };

  /* ---- leitura do BID colado direto no painel -------------------- */

  const BLOCO_BID = new RegExp(
    "([^\\n]+)\\n+" +
    "N.{0,3} de Contrato:\\s*(\\S*)\\n+" +
    "Tipo Contrato:\\s*([^\\n]*)\\n+" +
    "Publica..o:\\s*([^\\n]*)\\n+" +
    "Data In.cio:\\s*([^\\n]*)\\n+" +
    "Inscri..o:\\s*([^\\n]*)\\n+" +
    "Apelido:\\s*([^\\n]*)\\n+" +
    "Nascimento:\\s*([^\\n]*)\\n+" +
    "[ \\t]*([^\\n]+)",
    "g"
  );

  const SIT_BID = [
    { termos: ["rescis", "termino de contrato", "encerramento", "baixa", "desligamento"],
      sit: "VAGA ABERTA", peso: 30 },
    { termos: ["transferencia", "cessao", "emprestimo"], sit: "SAIDA", peso: 16 },
    { termos: ["contrato", "registro", "renovacao", "prorrogacao", "inscricao"],
      sit: "ENTRADA", peso: -12 },
  ];

  const processarBid = () => {
    const texto = bidTexto;
    if (!texto.trim()) return;

    BLOCO_BID.lastIndex = 0;
    const registros = [];
    let m;
    while ((m = BLOCO_BID.exec(texto)) !== null) {
      const nomeAtleta = m[1].trim();
      const tipo = m[3].trim();
      const publicacao = m[4].trim();
      const nascimento = m[8].trim();
      const clubeBruto = m[9].trim();

      // "Figueirense - SC" -> nome + UF
      const mc = clubeBruto.match(/^(.*?)\s*-\s*([A-Z]{2})$/);
      const nomeClube = (mc ? mc[1] : clubeBruto).trim();
      const uf = mc ? mc[2] : "";

      const cn = normNome(nomeClube);
      if (/^(liga|federacao|comarca)/.test(nomeClube.toLowerCase())) continue;
      if (!cn) continue;

      const t = nomeSimples(tipo);
      if (t.includes("vinculo nao profissional") || t.includes("liberar")) continue;

      let sit = "OUTRO", peso = 0;
      for (const r of SIT_BID) {
        if (r.termos.some((x) => t.includes(x))) { sit = r.sit; peso = r.peso; break; }
      }
      if (sit === "OUTRO") continue;

      // idade a partir da data de nascimento
      let idade = null;
      const dn = nascimento.match(/(\d{2})\/(\d{2})\/(\d{4})/);
      if (dn) {
        const hoje = new Date();
        idade = hoje.getFullYear() - Number(dn[3]);
        const passou =
          hoje.getMonth() + 1 > Number(dn[2]) ||
          (hoje.getMonth() + 1 === Number(dn[2]) && hoje.getDate() >= Number(dn[1]));
        if (!passou) idade--;
      }
      if (idade !== null && (idade < 18 || idade > 40)) continue;

      registros.push({ clube: nomeClube, uf, sit, peso, atleta: nomeAtleta, idade,
                       publicacao, tipo });
    }

    if (!registros.length) {
      setErro("Não reconheci nenhum registro. Copie a lista inteira de resultados do BID.");
      return;
    }

    // Um sinal do BID vale para todas as fichas daquele clube, em qualquer
    // posição — o BID não informa em que posição o atleta jogava.
    const mapa = new Map(clubes.map((c) => [c.id, { ...c }]));
    let aplicados = 0, novas = 0;

    for (const r of registros) {
      const alvo = [...mapa.values()].filter((c) => normNome(c.clube) === normNome(r.clube));
      const destinos = alvo.length ? alvo : [null];

      for (const d of destinos) {
        let c = d;
        if (!c) {
          c = { ...novoClube(), clube: r.clube, uf: r.uf, posicao: filtroPos || "ld" };
          mapa.set(c.id, c);
          novas++;
        }
        c.sinais = c.sinais || [];
        const sig = {
          fonte: "BID",
          quando: dataBR(r.publicacao) || HOJE(),
          peso: r.peso,
          atleta: r.atleta,
          texto: `${r.sit} — ${r.atleta}${r.idade ? `, ${r.idade} anos` : ""}`,
          link: "",
        };
        if (c.sinais.some((x) => x.fonte === "BID" && x.texto === sig.texto)) continue;
        c.sinais.push(sig);
        aplicados++;
        if (r.sit === "VAGA ABERTA" && c.statusTitular === "desconhecido")
          c.statusTitular = "saiu";
      }
    }

    commit({ clubes: [...mapa.values()] });
    setBidTexto("");
    setColarBid(false);
    setErro("");
    setAviso(
      `BID lido: ${registros.length} movimentação(ões) profissional(is) · ` +
      `${aplicados} sinal(is) aplicado(s)` + (novas ? ` · ${novas} clube(s) novo(s)` : "")
    );
  };

  /* ---- carteira de atletas --------------------------------------- */

  const editarAtleta = (id, campo, valor) =>
    commit({
      atletas: atletas.map((a) => (a.id === id ? { ...a, [campo]: valor } : a)),
    });

  const adicionarAtleta = () => {
    const novo = novoAtleta();
    commit({ atletas: [...atletas, novo] });
    setVerAtletas(true);
    return novo;
  };

  const removerAtleta = (id) => {
    commit({ atletas: atletas.filter((a) => a.id !== id) });
    if (atletaFoco === id) setAtletaFoco("");
  };

  /** O atleta escolhido para focar o ranking, se houver. */
  const emFoco = useMemo(
    () => atletas.find((a) => a.id === atletaFoco) || null,
    [atletas, atletaFoco]
  );

  /** Quais atletas seus se encaixam numa ficha de clube. */
  const atletasPara = (ficha) =>
    atletas.filter(
      (a) =>
        (a.posicao || "ld") === (ficha.posicao || "ld") &&
        (a.categoria || "pro") === (ficha.categoria || "pro")
    );

  /* ---- elenco puxado da sua API do ogol -------------------------- */

  /* A extração usa os filtros do ranking — posição e competição são
     escolhidas ali, não dentro do pop-up de notícias. */
  const edicaoAtual = EDICOES_OGOL[filtroComp] || "";

  /**
   * Dispara a extração na API local e acompanha até terminar.
   * A varredura é longa, então o trabalho roda em segundo plano e o
   * painel só pergunta o status de tempos em tempos.
   */
  const puxarDoOgol = async () => {
    const api = window.PG_OGOL;
    if (!api) {
      setErro("Endereço da API não configurado no arquivo.");
      return;
    }
    if (!edicaoAtual) {
      setErro(
        filtroComp
          ? `Não tenho o ID de edição de "${filtroComp}". Adicione em EDICOES_OGOL, no topo do arquivo.`
          : "Escolha uma competição no filtro acima antes de extrair."
      );
      return;
    }

    const posApi = POSICAO_NA_API[filtroPos];
    if (!posApi) {
      setErro(
        filtroPos
          ? "Essa posição não existe na API."
          : "Escolha uma posição no filtro acima antes de extrair."
      );
      return;
    }

    setPuxando(true);
    setErro("");
    setPopBusca(false);
    setProgressoOgol("iniciando…");

    try {
      const inicio = await fetch(api + "/extracoes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          edicao: edicaoAtual,
          posicao: posApi,
          rotulo: filtroComp,
          detalhar: true,
          so_ativos: true,
          cache_dias: 7,
          aguardar_ate: 20,   // se estiver tudo em cache, já volta pronto
        }),
      });

      if (!inicio.ok) {
        const txt = await inicio.text();
        throw new Error(`a API respondeu ${inicio.status}: ${txt.slice(0, 160)}`);
      }

      let job = await inicio.json();

      // Enquanto roda, pergunta a cada 5s. Teto de 90 minutos.
      const limite = Date.now() + 90 * 60 * 1000;
      while (job.status === "rodando" && Date.now() < limite) {
        setProgressoOgol(job.progresso || "varrendo o ogol…");
        await new Promise((r) => setTimeout(r, 5000));
        const r = await fetch(`${api}/extracoes/${job.job_id}`);
        job = await r.json();
      }

      if (job.status === "erro") {
        throw new Error(job.erro || "a extração falhou — veja o log da API");
      }
      if (job.status === "rodando") {
        throw new Error("passou de 90 minutos; confira direto na API");
      }
      if (!job.dados || !job.dados.length) {
        setErro("A extração terminou sem nenhum atleta nessa posição.");
        return;
      }

      // Mesma rotina do CSV: a API devolve as mesmas colunas.
      importarElenco(job.dados);
    } catch (e) {
      const msg = String((e && e.message) || e);
      setErro(
        /fetch|Failed|NetworkError/i.test(msg)
          ? "Não achei a API. Confira se o uvicorn está rodando nesta máquina."
          : msg
      );
    } finally {
      setPuxando(false);
      setProgressoOgol("");
    }
  };

  /* ---- planilha de elenco por posição ---------------------------- */

  /** "Paulista A4:19/1700 | Copa Paulista:3/270" -> mapa por competição. */
  const lerPorCompeticao = (texto) => {
    const mapa = {};
    for (const parte of String(texto || "").split("|")) {
      const corte = parte.lastIndexOf(":");
      if (corte < 0) continue;
      const nome = parte.slice(0, corte).trim();
      const [j, m] = parte.slice(corte + 1).trim().split("/");
      if (!nome) continue;
      mapa[nome] = { jogos: Number(j) || 0, min: Number(m) || 0 };
    }
    return mapa;
  };

  /** "Lateral Direito" -> "ld". Cai em lateral-direito se não reconhecer. */
  const posicaoParaId = (texto) => {
    const t = nomeSimples(texto);
    if (t.includes("lateral") && t.includes("esquerd")) return "le";
    if (t.includes("lateral") && t.includes("direit")) return "ld";
    if (t.includes("zagueiro") || t.includes("zaga")) return "zag";
    if (t.includes("volante")) return "vol";
    if (t.includes("meia") || t.includes("meio")) return "mei";
    if (t.includes("atacante") || t.includes("centroavante") || t.includes("ponta"))
      return "ata";
    if (t.includes("goleiro")) return "gol";
    return "ld";
  };

  const importarElenco = (linhas) => {
    // A planilha não traz categoria; vale a que estiver selecionada no
    // radar de notícias. Profissional é o padrão.
    const catImport = filtroCat || catBusca || "pro";

    // A competição da planilha é a que aparece em quase todos os atletas.
    const contagem = new Map();
    for (const l of linhas) {
      for (const nome of Object.keys(lerPorCompeticao(l._por_competicao))) {
        contagem.set(nome, (contagem.get(nome) || 0) + 1);
      }
    }
    const daPlanilha =
      [...contagem.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || "";

    const mapa = new Map(
      clubes.map((c) => [chaveFicha(c.clube, c.posicao, c.categoria), { ...c }])
    );
    const tocadas = new Set();
    let criadas = 0, atletas = 0;

    for (const l of linhas) {
      const clube = (l._clube || "").trim();
      const nome = (l._nome || "").trim();
      if (!clube || !nome) continue;

      const pos = posicaoParaId(l._posicao);
      const k = chaveFicha(clube, pos, catImport);

      let c = mapa.get(k);
      if (!c) {
        c = { ...novoClube(), clube, posicao: pos, categoria: catImport,
              competicao: daPlanilha };
        mapa.set(k, c);
        criadas++;
      }
      if (!c.competicao) c.competicao = daPlanilha;

      // Primeira linha deste clube nesta importação: elenco recomeça,
      // para a planilha nova não somar em cima da antiga.
      if (!tocadas.has(k)) {
        c.laterais = [];
        c.lds = "";
        tocadas.add(k);
      }

      c.laterais.push({
        nome,
        min: Number(l._minutos) || 0,
        jogos: Number(l._jogos) || 0,
        porComp: lerPorCompeticao(l._por_competicao),
      });
      atletas++;
    }

    // Ausência na planilha é informação, não lacuna: a planilha traz TODOS
    // os atletas daquela posição na competição. Clube que não aparece está
    // sem ninguém na posição — zero confirmado, que vale 80 pontos e vai
    // para o topo. É o contato mais quente que existe: o clube precisa,
    // e ninguém está olhando porque não houve lesão nem rescisão.
    const posicoesDaPlanilha = [
      ...new Set([...tocadas].map((k) => k.split("|")[1])),
    ];
    let zerados = 0;

    const marcarZero = (c) => {
      c.lds = "0";
      c.laterais = [];
      zerados++;
    };

    // 1. clubes que já estavam no radar
    for (const [k, c] of mapa.entries()) {
      if (tocadas.has(k)) continue;
      if (!daPlanilha || c.competicao !== daPlanilha) continue;
      if ((c.laterais || []).length) continue;
      if (!posicoesDaPlanilha.includes(c.posicao)) continue;
      marcarZero(c);
    }

    // 2. participantes da competição que ainda não tinham ficha nenhuma —
    //    sem isso eles ficariam invisíveis justamente por não ter ninguém.
    const participantes = CLUBES_POR_COMPETICAO[daPlanilha] || [];
    for (const item of participantes) {
      const nomeClube = typeof item === "string" ? item : item.nome;
      for (const pos of posicoesDaPlanilha) {
        const k = chaveFicha(nomeClube, pos, catImport);
        if (mapa.has(k)) continue;
        const c = {
          ...novoClube(),
          clube: nomeClube,
          posicao: pos,
          categoria: catImport,
          competicao: daPlanilha,
        };
        marcarZero(c);
        mapa.set(k, c);
        criadas++;
      }
    }

    commit({ clubes: [...mapa.values()] });
    if (daPlanilha) setFiltroComp(daPlanilha);
    const posPrincipal = linhas.length ? posicaoParaId(linhas[0]._posicao) : "";
    if (posPrincipal) setFiltroPos(posPrincipal);
    setFiltroCat(catImport);
    setConsulta({ pos: posPrincipal, comp: daPlanilha, cat: catImport });
    setPagina(0);
    setErro("");
    setAviso(
      `${atletas} atleta(s) em ${tocadas.size} ficha(s)` +
        (criadas ? ` · ${criadas} nova(s)` : "") +
        (zerados
          ? ` · ${zerados} clube(s) SEM NINGUÉM na posição (foram para o topo)`
          : "") +
        (daPlanilha ? ` · competição: ${daPlanilha}` : "")
    );
  };

  /* ---- trazer uma competição inteira para o radar ---------------- */

  const importarCompeticao = () => {
    if (!alvosDaBusca.length) {
      setErro("Escolha uma competição que tenha participantes cadastrados.");
      return;
    }

    const mapa = new Map(
      clubes.map((c) => [chaveFicha(c.clube, c.posicao, c.categoria), { ...c }])
    );
    let criadas = 0;

    for (const alvo of alvosDaBusca) {
      const k = chaveFicha(alvo.clube, posBusca, catBusca);
      if (mapa.has(k)) continue;
      mapa.set(k, {
        ...novoClube(),
        clube: alvo.clube,
        posicao: posBusca,
        categoria: catBusca,
        uf: alvo.uf || ufBusca || "",
        competicao: alvo.competicao || compBusca || "",
      });
      criadas++;
    }

    commit({ clubes: [...mapa.values()] });
    setPopBusca(false);
    setFiltroPos(posBusca);
    if (compBusca) setFiltroComp(compBusca);
    setConsulta({ pos: posBusca, comp: compBusca || "", cat: catBusca });
    setPagina(0);
    setErro("");
    setAviso(
      criadas
        ? `${criadas} ficha(s) criada(s). Agora preencha o elenco de cada uma — ` +
          `é o elenco que revela quem está frágil antes de qualquer notícia.`
        : "Todos esses clubes já estavam no radar nesta posição."
    );
  };

  /* ---- radar de notícias, direto da planilha --------------------- */

  /* Competições oferecidas na busca: nacionais + as da UF escolhida. */
  const compsDaBusca = useMemo(() => {
    const nac = NACIONAIS.map((n) => n.nome);
    const est = ufBusca ? ESTADUAIS[ufBusca] || [] : [];
    return [...nac, ...est];
  }, [ufBusca]);

  /* De onde saem os clubes da busca:
     1. da lista fixa no código, se a competição estiver lá;
     2. senão, das fichas que já tenham essa competição/UF. */
  const alvosDaBusca = useMemo(() => {
    const doCodigo = compBusca ? CLUBES_POR_COMPETICAO[compBusca] : null;
    if (doCodigo && doCodigo.length) {
      return doCodigo.map((x) => {
        const nome = typeof x === "string" ? x : x.nome;
        const evitar = typeof x === "string" ? [] : x.evitar || [];
        return { clube: nome, evitar, uf: ufBusca, competicao: compBusca };
      });
    }
    return clubes.filter(
      (c) =>
        c.clube &&
        (!ufBusca || (c.uf || "").toUpperCase() === ufBusca) &&
        (!compBusca || c.competicao === compBusca)
    );
  }, [clubes, ufBusca, compBusca]);

  const alvosVemDoCodigo = !!(
    compBusca && CLUBES_POR_COMPETICAO[compBusca] && CLUBES_POR_COMPETICAO[compBusca].length
  );

  const buscarNoticias = async () => {
    const alvos = alvosDaBusca.map((c) =>
      c.evitar && c.evitar.length ? { nome: c.clube, evitar: c.evitar } : c.clube
    );
    if (!alvos.length) {
      setErro("Nenhum clube nessa busca. Cadastre os participantes em CLUBES_POR_COMPETICAO, no topo do arquivo, ou preencha o campo Competição das fichas.");
      return;
    }
    const pos = POSICOES.find((x) => x.id === posBusca) || POSICOES[0];
    if (!window.PG_URL) {
      setErro("O radar de notícias só funciona na versão publicada, ligada à planilha.");
      return;
    }

    setBuscando(true);
    setErro("");
    setPopBusca(false);
    setAviso(`Procurando notícias em ${alvos.length} clube(s)…`);
    try {
      const r = await fetch(window.PG_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          acao: "noticias",
          clubes: alvos,
          posicao: pos.termos,
          busca: pos.busca,
          excluir: pos.excluir || [],
          periodo: periodoBusca,
        }),
      });

      const cru = await r.text();
      let j;
      try {
        j = JSON.parse(cru);
      } catch (e) {
        // Resposta que não é JSON quase sempre é página de erro do Google:
        // implantação antiga, sem permissão, ou script com falha.
        throw new Error(
          "A planilha respondeu algo que não é JSON (HTTP " + r.status + "). " +
          "Isso costuma ser implantação desatualizada ou acesso não liberado. " +
          "Início da resposta: " + cru.slice(0, 120)
        );
      }
      if (!j.ok) throw new Error("O script retornou erro: " + (j.erro || "sem detalhe"));
      if (j.erro) setErro("A busca teve falhas: " + j.erro);

      // A ficha é clube + posição: o mesmo clube pode estar no radar por
      // lateral-direito e por goleiro, com elencos e notas separados.
      const mapa = new Map(
        clubes.map((c) => [chaveFicha(c.clube, c.posicao, c.categoria), { ...c }])
      );
      let novos = 0, fichasNovas = 0;

      for (const a of j.alertas || []) {
        const k = chaveFicha(a.clube, posBusca, catBusca);
        let c = mapa.get(k);
        if (!c) {
          // Clube ainda sem ficha nesta posição: a notícia o traz ao radar.
          const origem =
            alvosDaBusca.find((x) => normNome(x.clube) === normNome(a.clube)) || {};
          c = { ...novoClube(), clube: a.clube, posicao: posBusca,
                categoria: catBusca,
                uf: origem.uf || ufBusca || "",
                competicao: origem.competicao || compBusca || "" };
          mapa.set(k, c);
          fichasNovas++;
        }
        c.sinais = c.sinais || [];
        // Contratação na posição fecha a vaga: o sinal existe, mas empurra
        // o clube para baixo em vez de subir.
        const chegou = /chegada/.test(a.sinais || "");
        const ladoIncerto = /lado_a_confirmar/.test(a.sinais || "");
        const sig = {
          fonte: a.fonte || "notícia",
          quando: dataBR(a.data) || HOJE(),
          peso: chegou ? -25 : Math.min(Number(a.pontos) || 0, 6) * 4,
          texto:
            (chegou ? "[vaga fechada] " : "") +
            (ladoIncerto ? "[lado?] " : "") +
            (a.titulo || ""),
          link: a.link || "",
        };
        if (!sig.texto) continue;
        if (c.sinais.some((x) => x.texto === sig.texto && x.fonte === sig.fonte)) continue;
        c.sinais.push(sig);
        novos++;

        if (c.statusTitular === "desconhecido" && !chegou) {
          if (/lesao/.test(a.sinais || "")) c.statusTitular = "lesionado";
          else if (/rescisao/.test(a.sinais || "")) c.statusTitular = "saiu";
          else if (/suspensao/.test(a.sinais || "")) c.statusTitular = "suspenso";
        }
      }

      if (novos) commit({ clubes: [...mapa.values()] });
      if (novos) setConsulta({ pos: posBusca, comp: compBusca || "", cat: catBusca });
      setAviso(
        novos
          ? `${novos} ${novos === 1 ? "alerta novo" : "alertas novos"}` +
            (fichasNovas ? ` · ${fichasNovas} clube(s) entrou(ram) no radar` : "") +
            " — a lista já foi reordenada"
          : (() => {
              const d = j.diagnostico || {};
              const partes = [];
              if (d.brutas !== undefined) partes.push(`o Google devolveu ${d.brutas}`);
              if (d.outroClube) partes.push(`${d.outroClube} de outro clube`);
              if (d.outroLado) partes.push(`${d.outroLado} do outro lado do campo`);
              if (d.semPosicao) partes.push(`${d.semPosicao} sem sinal na posição`);
              if (d.jaVistas) partes.push(`${d.jaVistas} já mostradas antes`);
              if (d.httpRuim) partes.push(`${d.httpRuim} recusadas pelo Google (HTTP ${d.ultimoHttp})`);
              if (d.semResposta) partes.push(`${d.semResposta} sem resposta`);
              if (d.falhas) partes.push(`${d.falhas} falha(s) de rede`);
              if (d.vazias) partes.push(`${d.vazias} clube(s) sem resposta do Google`);
              return `Nada novo em ${alvos.length} clube(s)` +
                (partes.length ? ` · ${partes.join(", ")}` : "");
            })()
      );
    } catch (e) {
      setErro(String((e && e.message) || e));
      setAviso("");
    } finally {
      setBuscando(false);
    }
  };

  const exportar = () => {
    const cab = ["clube", "uf", "competicao", "janela_ate", "lds_no_elenco", "titular", "status_titular", "ultimo_contato", "resposta", "proximo_followup", "notas", "score"];
    const linhas = ordenados.map((c) =>
      [c.clube, c.uf, c.competicao, c.janelaAte, c.lds, c.titular, c.statusTitular, c.ultimoContato, c.resposta, c.proximo, (c.notas || "").replace(/[\n;]/g, " "), c._s].join(";")
    );
    const blob = new Blob([[cab.join(";"), ...linhas].join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "painel-lateral-direito.csv";
    a.click();
  };

  const urgentes = ordenados.filter((c) => c._s >= 70).length;
  const semElenco = ordenados.filter((c) => !c._fantasma && !elenco(c)).length;

  const POR_PAGINA = 10;
  const paginas = Math.max(1, Math.ceil(ordenados.length / POR_PAGINA));
  const pagAtual = Math.min(pagina, paginas - 1);
  const visiveis = ordenados.slice(pagAtual * POR_PAGINA, (pagAtual + 1) * POR_PAGINA);

  return (
    <div className="quadro">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap');

        .quadro { min-height:100vh; background:${C.board};
          background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 46px), repeating-linear-gradient(90deg, rgba(255,255,255,.028) 0 1px, transparent 1px 46px);
          font-family:'Barlow',system-ui,sans-serif; color:${C.giz}; padding:20px 16px 60px; }
        .wrap { max-width:1080px; margin:0 auto; }

        .eyebrow { font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.16em; font-size:12px; color:${C.amber}; font-weight:600; }
        .marca { font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase;
          letter-spacing:.22em; font-size:12.5px; color:${C.amber}; }

          <button
            className="btn"
            style={{ alignSelf: "flex-end" }}
            onClick={puxarDoOgol}
            disabled={puxando || !edicaoAtual || !filtroPos}
            title={
              !filtroPos
                ? "escolha a posição"
                : !filtroComp
                ? "escolha a competição"
                : !edicaoAtual
                ? `sem ID de edição para ${filtroComp}`
                : "extrai posição, jogos e minutos pela sua API local"
            }
          >
            {puxando ? "extraindo…" : "Puxar elenco do ogol"}
          </button>

          {filtroComp && !edicaoAtual && (
            <span className="dicaExtracao">
              sem ID de edição para {filtroComp}
            </span>
          )}

          {consulta && (
            <button
              className="btn ghost"
              style={{ alignSelf: "flex-end" }}
              onClick={() => {
                setConsulta(null);
                setFiltroPos("");
                setFiltroComp("");
                setFiltroCat("");
                setFiltro("");
                setPagina(0);
              }}
            >limpar</button>
          )}
        </div>

        <div className="barra">
          <input className="busca" placeholder="Filtrar por clube, UF, competição…" value={filtro} onChange={(e) => { setFiltro(e.target.value); setPagina(0); }} />
          <button className="btn" onClick={() => { const n = novoClube(); commit({ clubes: [...clubes, n] }); setAberto(n.id); }}>Adicionar clube</button>
          <button className="btn" onClick={() => setPopBusca(!popBusca)} disabled={buscando}>
            {buscando ? "buscando…" : "Buscar notícias"}
          </button>
          <button className="btn ghost" onClick={() => setColando(!colando)}>Colar lista</button>
          <label className="btn ghost" style={{ cursor: "pointer" }}>
            Importar CSV dos scripts
            <input
              type="file"
              accept=".csv,text/csv"
              style={{ display: "none" }}
              onChange={(e) => { const f = e.target.files[0]; if (f) importarCSV(f); e.target.value = ""; }}
            />
          </label>
          <button className="btn ghost" onClick={exportar}>Exportar CSV</button>
          <button className="btn ghost" onClick={baixarBackup}>Backup</button>
          <button
            className="btn ghost"
            onClick={() => { setColarBackup(!colarBackup); setBackupTexto(""); }}
          >{colarBackup ? "cancelar" : "Restaurar"}</button>
        </div>

        {popBusca && (
          <div className="popBusca">
            <div className="popTitulo">Radar de notícias</div>

            <div className="popGrade">
              <div className="popCampo">
                <label>Posição</label>
                <select value={posBusca} onChange={(e) => setPosBusca(e.target.value)}>
                  {POSICOES.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}
                </select>
              </div>

              <div className="popCampo">
                <label>Categoria</label>
                <select value={catBusca} onChange={(e) => setCatBusca(e.target.value)}>
                  {CATEGORIAS.map((c) => (
                    <option key={c.id} value={c.id}>{c.label}</option>
                  ))}
                </select>
              </div>

              <div className="popCampo">
                <label>Período</label>
                <select value={periodoBusca} onChange={(e) => setPeriodoBusca(e.target.value)}>
                  {PERIODOS.map((p) => <option key={p.v} value={p.v}>{p.label}</option>)}
                </select>
              </div>

              <div className="popCampo">
                <label>Estado</label>
                <select
                  value={ufBusca}
                  onChange={(e) => { setUfBusca(e.target.value); setCompBusca(""); }}
                >
                  <option value="">todos</option>
                  {UFS.map((u) => <option key={u} value={u}>{u}</option>)}
                </select>
              </div>

              <div className="popCampo">
                <label>Competição</label>
                <select value={compBusca} onChange={(e) => setCompBusca(e.target.value)}>
                  <option value="">todas</option>
                  {compsDaBusca.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
            </div>

            {["3m", "6m", "1y"].includes(periodoBusca) && (
              <div className="popAlerta">
                Janela longa: a primeira busca pode trazer muita coisa de uma vez,
                e notícia antiga pesa pouco no ranking. Boa para mapear um clube novo,
                não para o acompanhamento do dia.
              </div>
            )}

            <div className="popNota">
              <b>Buscar notícias</b> traz só quem teve algum acontecimento.
              <b> Trazer os clubes</b> cria a ficha de todos — inclusive dos que
              estão quietos, que é onde mora a antecipação.
            </div>

            <div className="popResumo">
              {alvosDaBusca.length === 0 ? (
                <span style={{ color: C.alerta }}>
                  Nenhum clube nesta busca. Cadastre os participantes desta competição
                  em <b>CLUBES_POR_COMPETICAO</b>, no topo do arquivo — ou preencha o
                  campo <b>Competição</b> nas fichas.
                </span>
              ) : (
                <>
                  <b>{alvosDaBusca.length}</b> clube(s) ·{" "}
                  {alvosVemDoCodigo ? "lista da competição" : "clubes já no seu radar"}
                  <br />
                  {alvosDaBusca.slice(0, 8).map((c) => c.clube).join(", ")}
                  {alvosDaBusca.length > 8 ? ` e mais ${alvosDaBusca.length - 8}` : ""}
                </>
              )}
            </div>

            <div className="addComp">
              <button className="btn" onClick={buscarNoticias} disabled={buscando || !alvosDaBusca.length}>
                {buscando ? "buscando…" : "Buscar notícias"}
              </button>
              <button className="btn" onClick={importarCompeticao} disabled={!alvosDaBusca.length}>
                Trazer os {alvosDaBusca.length} clubes para o radar
              </button>
              <button
                className="btn ghost"
                onClick={() => { setUfBusca(""); setCompBusca(""); }}
              >limpar filtros</button>
              <button className="btn ghost" onClick={() => setPopBusca(false)}>fechar</button>
            </div>
          </div>
        )}

        {backupTexto && (
          <div className="caixaBackup">
            <div className="eyebrow" style={{ marginBottom: 6 }}>
              Seu backup — selecione tudo e copie (Ctrl+A, Ctrl+C dentro da caixa)
            </div>
            <textarea
              className="bulk"
              readOnly
              value={backupTexto}
              onFocus={(e) => e.target.select()}
              style={{ minHeight: 90, fontFamily: "monospace", fontSize: 11.5 }}
            />
            <div className="addComp">
              <button
                className="btn"
                onClick={() => {
                  navigator.clipboard
                    ? navigator.clipboard.writeText(backupTexto).then(
                        () => setAviso("Backup copiado"),
                        () => setAviso("Copie manualmente: clique na caixa e use Ctrl+C")
                      )
                    : setAviso("Copie manualmente: clique na caixa e use Ctrl+C");
                }}
              >Copiar</button>
              <button className="btn ghost" onClick={() => setBackupTexto("")}>fechar</button>
            </div>
          </div>
        )}

        {colarBackup && (
          <div className="caixaBackup">
            <div className="eyebrow" style={{ marginBottom: 6 }}>
              Cole aqui o backup e restaure
            </div>
            <textarea
              className="bulk"
              placeholder='Cole o texto do backup, começando com {"versao":1...'
              value={textoColado}
              onChange={(e) => setTextoColado(e.target.value)}
              style={{ minHeight: 90, fontFamily: "monospace", fontSize: 11.5 }}
            />
            <div className="addComp">
              <button
                className="btn"
                onClick={() => textoColado.trim() && restaurarBackup(textoColado.trim())}
              >Restaurar</button>
              <label className="btn ghost" style={{ cursor: "pointer" }}>
                ou escolher arquivo
                <input
                  type="file"
                  accept=".json,application/json"
                  style={{ display: "none" }}
                  onChange={(e) => { const f = e.target.files[0]; if (f) restaurarBackup(f); e.target.value = ""; }}
                />
              </label>
            </div>
          </div>
        )}

        {colando && (
          <div style={{ marginBottom: 14 }}>
            <textarea
              className="bulk"
              placeholder={"Um clube por linha. Opcional: clube; UF; competição\n\nCarlos Renaux; SC; Copa Santa Catarina\nInter de Limeira; SP; Copa Paulista"}
              value={bulk}
              onChange={(e) => setBulk(e.target.value)}
            />
            <button className="btn" style={{ marginTop: 8 }} onClick={importar}>Criar fichas</button>
          </div>
        )}

        {puxando && (
          <div className="eyebrow" style={{ color: C.amber, marginBottom: 10 }}>
            Extraindo do ogol — {progressoOgol || "aguardando"}
          </div>
        )}

        {aviso && (
          <div className="eyebrow" style={{ color: C.calma, marginBottom: 8 }}>{aviso}</div>
        )}

        {urgentes > 0 && (
          <div className="eyebrow" style={{ color: C.alerta, marginBottom: 10 }}>
            {urgentes} {urgentes === 1 ? "clube pede ligação hoje" : "clubes pedem ligação hoje"}
          </div>
        )}

        {semElenco > 0 && (
          <div className="eyebrow" style={{ color: C.amber, marginBottom: 10 }}>
            {semElenco} ficha(s) sem elenco mapeado — até preencher, o painel não
            enxerga fragilidade nelas
          </div>
        )}

        {carregando ? (
          <p style={{ color: "#A9BFB2" }}>Abrindo o quadro…</p>
        ) : !consulta ? (
          <div className="vazio">
            <h3>Escolha o que quer ver</h3>
            <p>
              Selecione a posição e a competição acima e clique em <b>Pesquisar</b>.
              Deixando as duas em “todas”, você vê o radar inteiro.
            </p>
            <button
              className="btn"
              onClick={() => { setConsulta({ pos: "", comp: "", cat: "" }); setPagina(0); }}
            >Ver tudo</button>
          </div>
        ) : ordenados.length === 0 ? (
          <div className="vazio">
            <h3>Nenhum clube nesta consulta</h3>
            <p>
              Nada corresponde a esses filtros. Tente outra competição, ou use o
              radar de notícias para trazer clubes que se movimentaram.
            </p>
            <button className="btn" onClick={() => { const n = novoClube(); commit({ clubes: [...clubes, n] }); setAberto(n.id); }}>Abrir a primeira ficha</button>
          </div>
        ) : (
          visiveis.map((c) => {
            const f = faixa(c._s);
            const d = dias(c.janelaAte);
            return (
              <div className="ficha" key={c.id} style={{ "--tom": f.cor }}>
                <div
                  className={"fichaTopo" + (c._fantasma ? " fantasma" : "")}
                  role="button"
                  tabIndex={0}
                  onClick={() => !c._fantasma && setAberto(aberto === c.id ? null : c.id)}
                  onKeyDown={(e) =>
                    !c._fantasma &&
                    (e.key === "Enter" || e.key === " ") &&
                    setAberto(aberto === c.id ? null : c.id)
                  }
                >
                  <div className="numero">{c._s}</div>
                  <div>
                    <div className="nome">{c.clube || "clube sem nome"}</div>
                    <div className="meta">
                      {[
                        rotuloPos(c.posicao || "ld"),
                        rotuloCat(c.categoria || "pro"),
                        c.uf,
                        c.competicao,
                      ].filter(Boolean).join(" · ")}
                      {c._fantasma ? " · fora do radar" : ""}
                      {d !== null && (d < 0 ? " · janela fechada" : ` · fecha em ${d} d`)}
                      {(() => {
                        if (c._fantasma) return "";
                        const e = elenco(c);
                        if (!e) return "";
                        return e.vazio
                          ? " · nenhum atleta na posição"
                          : ` · ${e.lds.length} no elenco · ${e.perfil}`;
                      })()}
                    </div>
                  </div>
                  {c._fantasma ? (
                    <button
                      className="btnEntrar"
                      onClick={(ev) => {
                        ev.stopPropagation();
                        const nova = {
                          ...novoClube(),
                          clube: c.clube,
                          competicao: c.competicao,
                          posicao: c.posicao,
                        };
                        commit({ clubes: [...clubes, nova] });
                        setAberto(nova.id);
                      }}
                    >trazer para o radar</button>
                  ) : (
                    <>
                      {!elenco(c) && <span className="seloVazio">sem elenco</span>}
                      <span className="selo">{f.label}</span>
                    </>
                  )}
                </div>

                {aberto === c.id && !c._fantasma && (
                  <div className="detalhe">
                    <div className="campo"><label>Clube</label>
                      <input value={c.clube} onChange={(e) => editar(c.id, "clube", e.target.value)} /></div>
                    <div className="campo"><label>UF</label>
                      <input value={c.uf} onChange={(e) => editar(c.id, "uf", e.target.value)} /></div>
                    <div className="campo"><label>Posição monitorada</label>
                      <select value={c.posicao || "ld"} onChange={(e) => editar(c.id, "posicao", e.target.value)}>
                        {POSICOES.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}
                      </select></div>
                    <div className="campo"><label>Categoria</label>
                      <select
                        value={c.categoria || "pro"}
                        onChange={(e) => editar(c.id, "categoria", e.target.value)}
                      >
                        {CATEGORIAS.map((x) => (
                          <option key={x.id} value={x.id}>{x.label}</option>
                        ))}
                      </select></div>
                    <div className="campo"><label>Competição</label>
                      <input value={c.competicao} onChange={(e) => editar(c.id, "competicao", e.target.value)} /></div>
                    <div className="campo"><label>Janela fecha em</label>
                      <input type="date" value={c.janelaAte} onChange={(e) => editar(c.id, "janelaAte", e.target.value)} /></div>
                    <div className="campo">
                      <label>Quantos há na posição (0 = confirmado vazio)</label>
                      <input
                        type="number"
                        min="0"
                        placeholder="deixe em branco se não sabe"
                        value={c.lds}
                        onChange={(e) => editar(c.id, "lds", e.target.value)}
                      /></div>
                    <div className="campo"><label>Titular da posição</label>
                      <input value={c.titular} onChange={(e) => editar(c.id, "titular", e.target.value)} /></div>
                    <div className="campo"><label>Situação do titular</label>
                      <select value={c.statusTitular} onChange={(e) => editar(c.id, "statusTitular", e.target.value)}>
                        {STATUS_TITULAR.map((s) => <option key={s.v} value={s.v}>{s.label}</option>)}
                      </select></div>
                    <div className="campo"><label>Último contato</label>
                      <input type="date" value={c.ultimoContato} onChange={(e) => editar(c.id, "ultimoContato", e.target.value)} /></div>
                    <div className="campo"><label>Resposta que deram</label>
                      <select value={c.resposta} onChange={(e) => editar(c.id, "resposta", e.target.value)}>
                        {RESPOSTAS.map((r) => <option key={r.v} value={r.v}>{r.label}</option>)}
                      </select></div>
                    <div className="campo"><label>Voltar a falar em</label>
                      <input type="date" value={c.proximo} onChange={(e) => editar(c.id, "proximo", e.target.value)} /></div>
                    <div className="campo wide">
                      <label>
                        {rotuloPos(c.posicao || "ld")}s do elenco — nome, minutos e jogos
                      </label>
                      {(c.laterais || []).map((ld, i) => (
                        <div className="ldLinha" key={i}>
                          <input
                            placeholder="nome"
                            value={ld.nome}
                            onChange={(ev) => {
                              const L = [...c.laterais];
                              L[i] = { ...L[i], nome: ev.target.value };
                              editar(c.id, "laterais", L);
                            }}
                          />
                          <input
                            type="number"
                            min="0"
                            placeholder="min"
                            title="minutos na temporada"
                            value={ld.min}
                            onChange={(ev) => {
                              const L = [...c.laterais];
                              L[i] = { ...L[i], min: ev.target.value };
                              editar(c.id, "laterais", L);
                            }}
                          />
                          <input
                            type="number"
                            min="0"
                            placeholder="jogos"
                            title="jogos disputados"
                            value={ld.jogos || ""}
                            onChange={(ev) => {
                              const L = [...c.laterais];
                              L[i] = { ...L[i], jogos: ev.target.value };
                              editar(c.id, "laterais", L);
                            }}
                          />
                          <button
                            className="ldFora"
                            title="remover"
                            onClick={() => editar(c.id, "laterais", c.laterais.filter((_, j) => j !== i))}
                          >×</button>
                        </div>
                      ))}
                      <button
                        className="ldMais"
                        onClick={() => editar(c.id, "laterais", [...(c.laterais || []), { nome: "", min: "", jogos: "" }])}
                      >+ atleta</button>
                      {(() => {
                        const e = elenco(c);
                        if (!e) return null;
                        return (
                          <div className="ldLeitura">
                            {e.vazio ? (
                              <b>Nenhum atleta na posição — vaga estruturalmente aberta</b>
                            ) : (
                              <>
                                <b>{e.perfil}</b> · {e.lds.length} no elenco ·{" "}
                                {Math.round(e.conc * 100)}% dos minutos no primeiro
                                {e.uso ? ` · ${e.uso}` : ""}
                              </>
                            )}
                          </div>
                        );
                      })()}
                    </div>

                    {atletasPara(c).length > 0 && (
                      <div className="campo wide">
                        <label>Seus atletas para esta vaga</label>
                        <ul className="meusAtletas">
                          {atletasPara(c).map((a) => {
                            const travado = Number(a.contratos_no_ano) >= 3;
                            return (
                              <li key={a.id} className={travado ? "travado" : ""}>
                                <b>{a.nome || "sem nome"}</b> · {rotuloCat(a.categoria)}
                                {a.situacao
                                  ? ` · ${(SITUACOES.find((x) => x.v === a.situacao) || {}).label}`
                                  : ""}
                                {travado && " · limite de 3 contratos atingido"}
                                {a.notas ? ` — ${a.notas}` : ""}
                              </li>
                            );
                          })}
                        </ul>
                      </div>
                    )}

                    {(c.sinais || []).length > 0 && (
                      <div className="campo wide">
                        <label>Sinais captados pelos scripts</label>
                        <ul className="sinais">
                          {[...c.sinais]
                            .sort((a, b) => (b.quando || "").localeCompare(a.quando || ""))
                            .slice(0, 8)
                            .map((s2) => (
                              <li key={(s2.fonte || "") + "|" + (s2.texto || "")}>
                                <button
                                  className="sinalFora"
                                  title="descartar este sinal"
                                  aria-label="descartar este sinal"
                                  onClick={() =>
                                    editar(
                                      c.id,
                                      "sinais",
                                      c.sinais.filter(
                                        (x) => !(x.texto === s2.texto && x.fonte === s2.fonte)
                                      )
                                    )
                                  }
                                >×</button>
                                <span>
                                  <b>{s2.fonte}</b>
                                  {s2.quem ? ` · ${s2.quem}` : ""}
                                  {s2.quando ? ` · ${s2.quando.split("-").reverse().join("/")}` : ""} —{" "}
                                  {s2.link ? (
                                    <a href={s2.link} target="_blank" rel="noreferrer">{s2.texto}</a>
                                  ) : (
                                    s2.texto
                                  )}
                                </span>
                              </li>
                            ))}
                        </ul>
                        {c.sinais.length > 8 && (
                          <div className="sinaisMais">
                            e mais {c.sinais.length - 8} sinal(is) mais antigo(s)
                          </div>
                        )}
                      </div>
                    )}
                    <div className="campo wide"><label>Notas — quem decide, telefone, o que foi dito</label>
                      <textarea rows="2" value={c.notas} onChange={(e) => editar(c.id, "notas", e.target.value)} /></div>
                    <div className="campo wide">
                      <button className="apagar" onClick={() => commit({ clubes: clubes.filter((x) => x.id !== c.id) })}>
                        Apagar esta ficha
                      </button>
                    </div>
                  </div>
                )}
              </div>
            );
          })
        )}

        {paginas > 1 && (
          <div className="paginacao">
            <button
              className="pagBtn"
              onClick={() => { setPagina(pagAtual - 1); setAberto(null); }}
              disabled={pagAtual === 0}
            >← anteriores</button>

            <span className="pagInfo">
              {pagAtual * POR_PAGINA + 1}–{Math.min((pagAtual + 1) * POR_PAGINA, ordenados.length)}
              {" de "}{ordenados.length}
            </span>

            <div className="pagNums">
              {Array.from({ length: paginas }, (_, i) => (
                <button
                  key={i}
                  className={"pagNum" + (i === pagAtual ? " ativo" : "")}
                  onClick={() => { setPagina(i); setAberto(null); }}
                  aria-current={i === pagAtual ? "page" : undefined}
                >{i + 1}</button>
              ))}
            </div>

            <button
              className="pagBtn"
              onClick={() => { setPagina(pagAtual + 1); setAberto(null); }}
              disabled={pagAtual >= paginas - 1}
            >seguintes →</button>
          </div>
        )}

        {erro && <p style={{ color: C.alerta, marginTop: 14, fontSize: 13.5 }}>{erro}</p>}
      </div>
    </div>
  );
}

const raiz = ReactDOM.createRoot(document.getElementById("raiz"));
raiz.render(<Painel />);
</script>
</body>
</html>
